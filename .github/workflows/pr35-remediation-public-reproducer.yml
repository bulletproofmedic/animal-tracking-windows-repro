name: PR35 bounded public remediation reproducer

on:
  push:
    branches:
      - validate/pr35-remediation-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Windows 2025 bounded diagnostic
    runs-on: windows-2025
    steps:
      - name: Check out exact public reproducer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.13.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: repro/requirements-pr35-remediation.txt

      - name: Record exact diagnostic identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Tee-Object evidence/public-reproducer-commit.txt
          python --version 2>&1 | Tee-Object evidence/python-version.txt
          python -c "import json, os, platform, sys; print(json.dumps({'github_sha': os.environ['GITHUB_SHA'], 'runner_os': os.environ['RUNNER_OS'], 'runner_arch': os.environ['RUNNER_ARCH'], 'platform': platform.platform(), 'python': sys.version}, indent=2))" | Tee-Object evidence/environment.json
          Get-FileHash repro/pr35-remediation-manifest.json -Algorithm SHA256 | Format-List | Out-File evidence/manifest-sha256.txt
          Get-FileHash repro/requirements-pr35-remediation.txt -Algorithm SHA256 | Format-List | Out-File evidence/requirements-sha256.txt

      - name: Verify successor binding manifest
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          manifest = json.loads(Path("repro/pr35-remediation-manifest.json").read_text(encoding="utf-8"))
          expected = {
              "commit": "0f03c09c0044a5a0f2cc04d0b82caa65086d874f",
              "tree": "1211dc48a9f25e17e1fcdbd85b4b31c222d80467",
              "parent": "e54622200d2c9dda3769f16529bbe204afe7755d",
          }
          actual = {key: manifest["successor"][key] for key in expected}
          print(json.dumps({"expected": expected, "actual": actual}, indent=2))
          if actual != expected:
              raise SystemExit("Successor binding mismatch")
          '@ | python - 2>&1 | Tee-Object evidence/successor-binding.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install exact locked versions
        shell: pwsh
        run: |
          python -m pip install --requirement repro/requirements-pr35-remediation.txt 2>&1 | Tee-Object evidence/pip-install.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check 2>&1 | Tee-Object evidence/pip-check.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze --all | Tee-Object evidence/pip-freeze.txt

      - name: Verify exact package versions
        shell: pwsh
        run: |
          @'
          import importlib.metadata as metadata
          import json
          expected = {
              "asgiref": "3.12.1", "Django": "5.2.16", "Pillow": "12.3.0",
              "sqlparse": "0.5.5", "tzdata": "2026.3", "uuid6": "2025.0.1",
              "waitress": "3.0.2", "coverage": "7.15.2", "mypy": "2.3.0",
              "pytest": "9.1.1", "pytest-django": "4.12.0", "ruff": "0.15.22",
          }
          actual = {name: metadata.version(name) for name in expected}
          print(json.dumps({"expected": expected, "actual": actual}, indent=2))
          mismatches = {name: (expected[name], actual[name]) for name in expected if expected[name] != actual[name]}
          if mismatches:
              raise SystemExit(f"Locked version mismatch: {mismatches}")
          '@ | python - 2>&1 | Tee-Object evidence/locked-versions.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run bounded algorithm tests
        working-directory: repro
        shell: pwsh
        run: |
          python -m pytest -q --junitxml=../evidence/junit.xml 2>&1 | Tee-Object ../evidence/pytest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ruff
        if: always()
        shell: pwsh
        run: |
          python -m ruff check repro 2>&1 | Tee-Object evidence/ruff-check.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check repro 2>&1 | Tee-Object evidence/ruff-format.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mypy
        if: always()
        shell: pwsh
        run: |
          python -m mypy --strict --ignore-missing-imports repro/pr35_remediation_repro.py 2>&1 | Tee-Object evidence/mypy.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Hash evidence
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem evidence -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash.ToLower())  $($_.FullName.Substring($PWD.Path.Length + 1).Replace('\\','/'))"
            } | Set-Content evidence/SHA256SUMS.txt
          Get-Content evidence/SHA256SUMS.txt

      - name: Upload bounded public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr35-remediation-bounded-public-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
