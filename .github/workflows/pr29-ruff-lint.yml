name: PR29 Ruff Lint Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
      - name: Install exact Ruff version
        run: python -m pip install ruff==0.15.22
      - name: Print exact lint diagnostics
        working-directory: repro/pr29
        run: python -m ruff check . --config pyproject.toml --output-format=full
