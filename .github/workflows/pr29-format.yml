name: PR29 sanitized Ruff formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sanitized formatter input
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up parity Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
      - name: Format sanitized files
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet ruff==0.15.22
          python -m ruff format repro/pr29
      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr29-formatted-python
          path: repro/pr29
          if-no-files-found: error
          retention-days: 1
