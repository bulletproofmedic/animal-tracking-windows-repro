name: R1 Security Events Diagnostic

on:
  push:
    branches:
      - diag/r1-application-security-events-cf003
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-security-events-cf003-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out sanitized payload
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.13.14
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13.14"

      - name: Test public payload guard
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Enforce public payload boundary
        shell: pwsh
        run: python scripts/check_public_payload.py

      - name: Compile sanitized lifecycle
        shell: pwsh
        run: python -m compileall -q repro

      - name: Run sanitized lifecycle tests
        shell: pwsh
        run: python -m unittest discover -s repro/tests -p 'test_security_event_lifecycle.py' -v
