name: Ruff Format Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Emit remaining exact Ruff patches
        shell: bash
        run: >-
          set -euo pipefail;
          git clone --quiet --depth 1 --branch diag/ruff-format-pr29 https://github.com/bulletproofmedic/animal-tracking-windows-repro.git workspace;
          mkdir workspace/candidate;
          for name in logging_config.py support_bundle.py test_support_bundle.py pyproject.toml; do base64 --decode "workspace/repro/ra-remediation/${name}.gz.b64" | gzip --decompress > "workspace/candidate/${name}"; done;
          cp workspace/repro/ra-remediation/test_logging_config.py workspace/candidate/test_logging_config.py;
          python -m pip install --quiet ruff==0.15.22;
          cp -R workspace/candidate workspace/original;
          cd workspace/candidate;
          python -m ruff check . --fix --config pyproject.toml >/dev/null;
          python -m ruff format . --config pyproject.toml >/dev/null;
          python -m ruff check . --config pyproject.toml >/dev/null;
          python -m ruff format --check . --config pyproject.toml >/dev/null;
          cd ..;
          for name in support_bundle.py test_logging_config.py test_support_bundle.py; do patch="${name}.patch"; diff -u "original/${name}" "candidate/${name}" > "${patch}" || true; echo "PATCH_SHA256 ${name} $(sha256sum "${patch}" | cut -d' ' -f1)"; printf 'PATCH_BASE64 %s ' "${name}"; gzip -n -9 -c "${patch}" | base64 -w0; echo; done
