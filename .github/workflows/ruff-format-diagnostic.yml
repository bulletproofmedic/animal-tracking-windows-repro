name: Ruff Format Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone sanitized diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch diag/ruff-format-pr29 \
            https://github.com/bulletproofmedic/animal-tracking-windows-repro.git workspace
      - name: Extract and verify sanitized candidate
        shell: bash
        working-directory: workspace
        run: |
          set -euo pipefail
          mkdir candidate
          for name in logging_config.py support_bundle.py test_support_bundle.py pyproject.toml; do
            base64 --decode "repro/ra-remediation/${name}.gz.b64" | gzip --decompress > "candidate/${name}"
          done
          cp repro/ra-remediation/test_logging_config.py candidate/test_logging_config.py
          echo '7bc0f9be4cc1f0e5a6aa8eaa02445f2abf53f380eb969e54bd5d6ae682cdef51  candidate/logging_config.py' | sha256sum --check
          echo '11a05efdce7ef0d82be8669a6ff45ed0e7f1398a106c1cfb7b06869e67f33e0a  candidate/support_bundle.py' | sha256sum --check
          sha256sum candidate/test_logging_config.py
          echo 'ee2a80a03d4defd4808dd253082692d2c0a0094d265efe7a3cd9f61783db39ff  candidate/test_support_bundle.py' | sha256sum --check
          echo '656b098a4372fc7f16620858809454d349999a8ccd3e0bff2372aec879cbb729  candidate/pyproject.toml' | sha256sum --check
      - name: Install exact Ruff version
        shell: bash
        run: python -m pip install ruff==0.15.22
      - name: Print exact lint diagnostics
        shell: bash
        working-directory: workspace/candidate
        run: python -m ruff check . --config pyproject.toml --output-format=full
      - name: Print exact formatting patch
        if: always()
        shell: bash
        working-directory: workspace/candidate
        run: python -m ruff format --diff . --config pyproject.toml
