name: Ruff Format Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sanitized diagnostic branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: diag/ruff-format-pr29
      - name: Normalize and persist exact Ruff output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf candidate repro/ra-normalized
          mkdir candidate repro/ra-normalized
          for name in logging_config.py support_bundle.py test_support_bundle.py pyproject.toml; do
            base64 --decode "repro/ra-remediation/${name}.gz.b64" | gzip --decompress > "candidate/${name}"
          done
          cp repro/ra-remediation/test_logging_config.py candidate/test_logging_config.py
          python -m pip install --quiet ruff==0.15.22
          cd candidate
          python -m ruff check . --fix --config pyproject.toml
          python -m ruff format . --config pyproject.toml
          python -m ruff check . --config pyproject.toml
          python -m ruff format --check . --config pyproject.toml
          cd ..
          cp candidate/logging_config.py repro/ra-normalized/logging_config.py
          cp candidate/support_bundle.py repro/ra-normalized/support_bundle.py
          cp candidate/test_logging_config.py repro/ra-normalized/test_logging_config.py
          cp candidate/test_support_bundle.py repro/ra-normalized/test_support_bundle.py
          sha256sum repro/ra-normalized/*.py > repro/ra-normalized/SHA256SUMS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repro/ra-normalized
          if ! git diff --cached --quiet; then
            git commit -m "Record exact Ruff-normalized security remediation sources"
            git push origin HEAD:diag/ruff-format-pr29
          fi
