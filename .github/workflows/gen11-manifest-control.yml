name: Generation 11 manifest control

on:
  pull_request:
    paths:
      - ".github/workflows/gen11-manifest-control.yml"
      - "repro/gen11_manifest_control/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-manifest-control:
    runs-on: windows-2025
    steps:
      - name: Check out bounded reproducer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Set up CPython 3.13.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
      - name: Verify Python and payload boundary
        shell: pwsh
        run: |
          python --version
          git --version
          $files = git diff --name-only origin/main...HEAD
          $unexpected = $files | Where-Object {
            $_ -ne ".github/workflows/gen11-manifest-control.yml" -and
            -not $_.StartsWith("repro/gen11_manifest_control/")
          }
          if ($unexpected) {
            Write-Error "Unexpected public payload paths: $($unexpected -join ', ')"
            exit 1
          }
      - name: Compile sanitized model
        run: python -m py_compile repro/gen11_manifest_control/test_manifest_model.py
      - name: Run topology model and eleven mutations
        run: >-
          python -m unittest discover
          -s repro/gen11_manifest_control
          -p "test_*.py"
          -v
