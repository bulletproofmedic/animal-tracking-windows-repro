name: Public Windows Reproducer

on:
  pull_request:
    paths:
      - ".github/workflows/windows-repro.yml"
      - "repro/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: public-windows-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out sanitized reproducer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # This isolated diagnostic branch validates only its current synthetic payload.
          # Repository-wide history hygiene remains a separate unresolved control.
          fetch-depth: 1

      - name: Set up parity Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13.14"

      - name: Test public payload guard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s tests -v

      - name: Enforce current synthetic payload boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/check_public_payload.py

      - name: Record hosted Windows environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          git --version
          $os = Get-CimInstance Win32_OperatingSystem
          [PSCustomObject]@{
            Caption = $os.Caption
            Version = $os.Version
            BuildNumber = $os.BuildNumber
            Architecture = $os.OSArchitecture
          } | Format-List

      - name: Run staged reproducer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "repro/run.ps1") {
            & "repro/run.ps1"
          } else {
            Write-Host "No reproducer is staged. Windows runner smoke test passed."
          }
