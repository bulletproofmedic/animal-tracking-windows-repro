name: Public Windows Reproducer

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-at-r1-sec-cf-004-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifest-ci-controls:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Validate sanitized CF-004 payload on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($null -ne $event.pull_request) {
            $payloadSha = $event.pull_request.head.sha
          } else {
            $payloadSha = $env:GITHUB_SHA
          }

          $python = Get-ChildItem "C:\hostedtoolcache\windows\Python\3.13.*\x64\python.exe" |
            Sort-Object FullName |
            Select-Object -Last 1
          if ($null -eq $python) {
            throw "Python 3.13 was not found on the hosted Windows image."
          }
          $env:PATH = "$(Split-Path $python.FullName);$env:PATH"

          python --version
          git --version
          git clone --no-tags --single-branch --branch diag/at-r1-sec-cf-004-manifest-ci `
            "https://github.com/$env:GITHUB_REPOSITORY.git" public-repro
          git -C public-repro checkout $payloadSha
          Push-Location public-repro
          try {
            python -m unittest discover -s tests -v
            python scripts/check_public_payload.py
            $os = Get-CimInstance Win32_OperatingSystem
            [PSCustomObject]@{
              Caption = $os.Caption
              Version = $os.Version
              BuildNumber = $os.BuildNumber
              Architecture = $os.OSArchitecture
              PayloadSha = $payloadSha
            } | Format-List
            & "repro/run.ps1"
          }
          finally {
            Pop-Location
          }
