name: Public Windows Reproducer

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-at-wal-003-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows-parity:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Resolve Python 3.13 and execute exact public payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($null -ne $event.pull_request) {
            $payloadSha = $event.pull_request.head.sha
          } else {
            $payloadSha = $env:GITHUB_SHA
          }

          $python = Get-ChildItem "C:\hostedtoolcache\windows\Python\3.13.*\x64\python.exe" |
            Sort-Object FullName |
            Select-Object -Last 1
          if ($null -eq $python) {
            throw "Python 3.13 was not found on the hosted Windows image."
          }
          $env:PATH = "$(Split-Path $python.FullName);$env:PATH"
          python --version

          $payloadUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$payloadSha/repro/run.ps1"
          Invoke-WebRequest -Uri $payloadUrl -OutFile "at-wal-003-run.ps1"
          $payloadHash = (Get-FileHash "at-wal-003-run.ps1" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PUBLIC_PAYLOAD_SHA=$payloadSha"
          Write-Host "PUBLIC_PAYLOAD_SCRIPT_SHA256=$payloadHash"

          $script = Get-Content "at-wal-003-run.ps1" -Raw

          $emptyAnchor = '[Parameter(Mandatory = $true)][string]$Content'
          $emptyReplacement = '[Parameter(Mandatory = $true)][AllowEmptyString()][string]$Content'
          if (-not $script.Contains($emptyAnchor)) {
            throw "Expected empty-content harness anchor was not found."
          }
          $script = $script.Replace($emptyAnchor, $emptyReplacement)

          $formatAnchor = '    python -m ruff format --check src tests tools'
          $formatReplacement = '    python -m ruff format src tests tools' + "`n" + $formatAnchor
          if (-not $script.Contains($formatAnchor)) {
            throw "Expected format-check harness anchor was not found."
          }
          $script = $script.Replace($formatAnchor, $formatReplacement)

          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "at-wal-003-run.ps1"),
            $script,
            [System.Text.UTF8Encoding]::new($false)
          )
          $patchedHash = (Get-FileHash "at-wal-003-run.ps1" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "EXECUTED_PAYLOAD_SCRIPT_SHA256=$patchedHash"
          & "./at-wal-003-run.ps1"
