name: AT-WAL-006 Public Semantic Diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: at-wal-006-public-semantic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out sanitized reproducer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up parity Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13.14"

      - name: Test public payload guard
        run: python -m unittest discover -s tests -v

      - name: Enforce public payload boundary
        run: python scripts/check_public_payload.py

      - name: Record hosted Linux environment
        run: |
          python --version
          git --version
          uname -a

      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check --no-input ruff==0.15.22

      - name: Compile sanitized controls
        run: |
          python -m compileall -q \
            repro/at_wal_006_controls.py \
            repro/tests/test_at_wal_006_controls.py

      - name: Lint sanitized controls
        run: |
          python -m ruff check \
            repro/at_wal_006_controls.py \
            repro/tests/test_at_wal_006_controls.py

      - name: Verify formatting
        run: |
          python -m ruff format --check \
            repro/at_wal_006_controls.py \
            repro/tests/test_at_wal_006_controls.py

      - name: Run bounded semantic controls
        env:
          PYTHONPATH: repro
        run: python -m unittest discover -s repro/tests -v
