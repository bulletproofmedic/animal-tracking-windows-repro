name: Public Windows Reproducer

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-runner-allocation-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allocation-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm standard public runner allocation
        run: echo "PUBLIC_STANDARD_RUNNER_ALLOCATED"
