name: Public Windows Reproducer

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-windows-repro-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out exact sanitized commit
        shell: pwsh
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Force | Remove-Item -Recurse -Force
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin $env:TARGET_SHA
          git checkout --detach FETCH_HEAD
          if ((git rev-parse HEAD).Trim() -ne $env:TARGET_SHA) {
            throw "Exact target checkout mismatch."
          }

      - name: Select hosted Python 3.13
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = Get-ChildItem "$env:RUNNER_TOOL_CACHE\Python\3.13.*\x64\python.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $python) {
            throw "Hosted Python 3.13 was not found."
          }
          $python.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $python.FullName --version

      - name: Record hosted Windows environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          git --version
          $os = Get-CimInstance Win32_OperatingSystem
          [PSCustomObject]@{
            Caption = $os.Caption
            Version = $os.Version
            BuildNumber = $os.BuildNumber
            Architecture = $os.OSArchitecture
          } | Format-List

      - name: Run sanitized post-restore controls
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "repro/run.ps1"
