name: Public Ruff Diagnostic

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-ruff-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out sanitized reproducer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce public payload boundary
        run: python scripts/check_public_payload.py

      - name: Run bounded synthetic Ruff diagnostic
        run: |
          python -m pip install --quiet --disable-pip-version-check ruff==0.15.22
          mkdir -p repro
          cat > repro/candidate.py <<'PY'
          from __future__ import annotations

          import sqlite3
          import zipfile
          from contextlib import suppress
          from pathlib import Path
          from typing import BinaryIO, IO


          def explicit_reraise(path: Path) -> None:
              try:
                  path.read_text(encoding="utf-8")
              except OSError:
                  raise


          def broad_suppression() -> None:
              with suppress(Exception):
                  from django.db import connections

                  connections.close_all()


          def passive_branch(source: Path, destination: Path) -> None:
              if source.exists() and not destination.exists():
                  source.replace(destination)
              elif not source.exists() and destination.exists():
                  pass
              else:
                  raise RuntimeError("inconsistent synthetic state")


          def normalized_mapping(raw: dict[object, object]) -> dict[str, object]:
              if not all(isinstance(key, str) for key in raw):
                  raise ValueError("synthetic keys must be strings")
              return {str(key): value for key, value in raw.items()}


          def union_exception(exc: BaseException) -> bool:
              return isinstance(exc, OSError | RuntimeError | NotImplementedError | ValueError)


          def open_members(archive: zipfile.ZipFile, member: str) -> bytes:
              with archive.open(member, "r") as handle:
                  return handle.read()


          def typed_handles(handle: BinaryIO, stream: IO[bytes]) -> tuple[BinaryIO, IO[bytes]]:
              return handle, stream


          def sqlite_context(path: Path) -> None:
              with sqlite3.connect(path) as connection:
                  connection.execute("SELECT 1")
          PY
          cat > repro/pyproject.toml <<'TOML'
          [tool.ruff]
          target-version = "py313"
          line-length = 100

          [tool.ruff.lint]
          select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
          ignore = ["S101", "E501", "UP046"]
          TOML
          cd repro
          ruff check candidate.py --output-format concise
