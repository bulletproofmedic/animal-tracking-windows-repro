name: OCR Candidate Bootstrap Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/ocr-candidate-bootstrap-20260803

permissions:
  contents: read
  statuses: write

concurrency:
  group: ocr-candidate-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact diagnostic commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact diagnostic commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Build public OCR bootstrap bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          mkdir -p bundle/wheelhouse bundle/models/easyocr bundle/models/paddle

          python -m pip install "paddlepaddle==3.3.1" "paddleocr==3.7.0"
          python -m pip freeze --all | sort > bundle/paddle_environment_lock.txt
          python -m pip download --dest bundle/wheelhouse -r bundle/paddle_environment_lock.txt
          python -m pip download --dest bundle/wheelhouse --no-deps \
            "easyocr==1.7.2" python-bidi pyclipper ninja

          curl --fail --location --retry 3 \
            --output /tmp/craft_mlt_25k.zip \
            https://github.com/JaidedAI/EasyOCR/releases/download/pre-v1.1.6/craft_mlt_25k.zip
          curl --fail --location --retry 3 \
            --output /tmp/english_g2.zip \
            https://github.com/JaidedAI/EasyOCR/releases/download/v1.3/english_g2.zip
          unzip -j /tmp/craft_mlt_25k.zip -d bundle/models/easyocr
          unzip -j /tmp/english_g2.zip -d bundle/models/easyocr

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          from paddleocr import PaddleOCR

          probe = Path("/tmp/paddle_probe.png")
          image = Image.new("RGB", (640, 160), "white")
          ImageDraw.Draw(image).text(
              (20, 50),
              "SPYPOINT 02/08/2026 02:18 65F 18C COYOTE",
              fill="black",
          )
          image.save(probe)
          engine = PaddleOCR(
              text_detection_model_name="PP-OCRv6_small_det",
              text_recognition_model_name="PP-OCRv6_small_rec",
              use_doc_orientation_classify=False,
              use_doc_unwarping=False,
              use_textline_orientation=False,
              device="cpu",
          )
          list(engine.predict(str(probe)))
          PY

          for candidate in "$HOME/.paddlex" "$HOME/.paddleocr"; do
            if [ -d "$candidate" ]; then
              cp -a "$candidate" bundle/models/paddle/
            fi
          done

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import platform
          import subprocess
          import sys

          root = Path("bundle")
          files = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              data = path.read_bytes()
              files.append({
                  "relative_path": path.relative_to(root).as_posix(),
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              "record_type": "ANIMAL_TRACKING_OCR_CANDIDATE_PUBLIC_BOOTSTRAP_BUNDLE",
              "python": sys.version,
              "platform": platform.platform(),
              "pip_freeze": subprocess.check_output(
                  [sys.executable, "-m", "pip", "freeze", "--all"], text=True
              ).splitlines(),
              "candidate_scope": {
                  "tesseract": "provided by target runtime",
                  "paddleocr": "3.7.0 / PaddlePaddle 3.3.1 / PP-OCRv6 small",
                  "easyocr": "1.7.2 / CRAFT / English generation 2",
                  "formats": ["JPEG", "PNG"],
              },
              "files": files,
          }
          (root / "bootstrap_manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
          du -sh bundle

      - name: Upload OCR bootstrap bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: animal-tracking-ocr-candidate-bootstrap
          path: bundle/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Publish diagnostic run locator
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            STATE=error
          else
            STATE=failure
          fi
          export STATE
          python - <<'PY' > /tmp/status.json
          import json
          import os

          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "ocr-candidate-bootstrap",
              "description": (
                  f"run_id={os.environ['GITHUB_RUN_ID']} "
                  f"status={os.environ['JOB_STATUS']}"
              ),
              "target_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
          }))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json
