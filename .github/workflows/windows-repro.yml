name: Public Windows Reproducer

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-at-wal-003-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-linux-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out sanitized reproducer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up parity Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Test public payload guard
        run: python -m unittest discover -s tests -v

      - name: Enforce public payload boundary
        run: python scripts/check_public_payload.py

      - name: Run staged reproducer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "repro/run.ps1"
