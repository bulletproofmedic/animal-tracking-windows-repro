name: Public Windows Reproducer

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-windows-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out exact sanitized commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact sanitized commit
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) {
            throw "Exact target checkout mismatch."
          }

      - name: Bind private target identity (metadata only)
        shell: pwsh
        env:
          PRIVATE_TARGET_COMMIT: 61d657b93fc31b2916fc1af7ddb92f72ba387bce
          PRIVATE_TARGET_TREE: d0a8f3c2a86078ffe499dc70032802de8c5a774a
        run: |
          $ErrorActionPreference = "Stop"
          $targets = @{
            PRIVATE_TARGET_COMMIT = $env:PRIVATE_TARGET_COMMIT
            PRIVATE_TARGET_TREE = $env:PRIVATE_TARGET_TREE
          }
          foreach ($target in $targets.GetEnumerator()) {
            if ($target.Value -cnotmatch '^[0-9a-f]{40}$') {
              throw "$($target.Key) must be lowercase 40-hex."
            }
            Write-Host "$($target.Key)=$($target.Value)"
          }
          Write-Host "PRIVATE_TARGET_BINDING=IDENTITY_ONLY"

      - name: Set up parity Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Test public payload guard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s tests -v

      - name: Enforce public payload boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/check_public_payload.py

      - name: Record hosted Windows environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          git --version
          $os = Get-CimInstance Win32_OperatingSystem
          [PSCustomObject]@{
            Caption = $os.Caption
            Version = $os.Version
            BuildNumber = $os.BuildNumber
            Architecture = $os.OSArchitecture
          } | Format-List

      - name: Run staged reproducer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "repro/run.ps1") {
            & "repro/run.ps1"
          } else {
            Write-Host "No reproducer is staged. Windows runner smoke test passed."
          }
