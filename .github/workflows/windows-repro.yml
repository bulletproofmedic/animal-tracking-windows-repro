name: Public Windows Reproducer

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-windows-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out sanitized reproducer with native Git
        shell: pwsh
        env:
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --no-tags --prune origin "+refs/heads/$env:CHECKOUT_REF`:refs/remotes/origin/$env:CHECKOUT_REF"
          git checkout --detach $env:CHECKOUT_SHA
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CHECKOUT_SHA) {
            throw "Checkout identity mismatch: expected $env:CHECKOUT_SHA, got $actual"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "AT_PUBLIC_COMMIT=$actual"
          Write-Host "Checked out sanitized public commit $actual"
          Write-Host "Fetched complete ancestry only for branch $env:CHECKOUT_REF"

      - name: Select hosted Python 3.13
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = (& py -3.13 -c "import sys; print(sys.executable)").Trim()
          if (-not $python) { throw "Hosted Python 3.13 was not found." }
          $pythonDirectory = Split-Path -Parent $python
          $pythonScripts = Join-Path $pythonDirectory "Scripts"
          $env:PATH = "$pythonDirectory;$pythonScripts;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $pythonDirectory
          Add-Content -Path $env:GITHUB_PATH -Value $pythonScripts
          python --version

      - name: Test public payload guard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s tests -v

      - name: Enforce public payload boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/check_public_payload.py

      - name: Record hosted Windows environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          git --version
          $os = Get-CimInstance Win32_OperatingSystem
          [PSCustomObject]@{
            Caption = $os.Caption
            Version = $os.Version
            BuildNumber = $os.BuildNumber
            Architecture = $os.OSArchitecture
          } | Format-List

      - name: Run staged reproducer and emit bounded evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $runExitCode = 0
          try {
            & "repro/run.ps1"
            $runExitCode = $LASTEXITCODE
          } catch {
            $runExitCode = 1
            Write-Error "Diagnostic terminated after preserving evidence: $($_.Exception.Message)"
          }

          $evidenceRoot = Join-Path $env:RUNNER_TEMP "artifacts/at-r1-sec-cf-009"
          $runRecord = Join-Path $evidenceRoot "evidence/acceptance-run.json"
          $checksums = Join-Path $evidenceRoot "EVIDENCE_SHA256SUMS.txt"

          if (Test-Path $runRecord -PathType Leaf) {
            Write-Host "===== BEGIN ACCEPTANCE RUN RECORD ====="
            Get-Content $runRecord -Raw -Encoding utf8
            Write-Host "===== END ACCEPTANCE RUN RECORD ====="
          } else {
            Write-Error "Acceptance run record was not produced at $runRecord."
            if ($runExitCode -eq 0) { $runExitCode = 90 }
          }

          if (Test-Path $checksums -PathType Leaf) {
            Write-Host "===== BEGIN EVIDENCE SHA256SUMS ====="
            Get-Content $checksums -Raw -Encoding ascii
            Write-Host "===== END EVIDENCE SHA256SUMS ====="
          }

          exit $runExitCode
