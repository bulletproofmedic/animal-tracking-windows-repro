name: AT-WAL-001 F002 migration 0008 validation

on:
  pull_request:
    paths:
      - "f002_repro/**"
      - ".github/workflows/at-wal-001-f002-migration-0008.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up CPython 3.13.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
      - name: Verify bounded payload identities
        shell: pwsh
        run: |
          $migration = (git hash-object f002_repro/0008_interval_chronology_guards.py).Trim()
          $tests = (git hash-object f002_repro/test_migration_0008_sql.py).Trim()
          if ($migration -ne "8dda06ce835a8cb3af6a3092d1e25da8ad07909e") {
            throw "Migration payload mismatch: $migration"
          }
          if ($tests -ne "e31084498321a9f41223ac32c97f101fe185de8b") {
            throw "Test payload mismatch: $tests"
          }
      - name: Install exact runtime dependency
        run: python -m pip install Django==5.2.16
      - name: Compile migration and validation
        run: python -m compileall -q f002_repro
      - name: Run bounded database, rollback, and concurrency validation
        run: python -m unittest -v f002_repro/test_migration_0008_sql.py
