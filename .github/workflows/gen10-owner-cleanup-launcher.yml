name: Generation 10 owner-cleanup launcher

on:
  pull_request:
    paths:
      - ".github/workflows/gen10-owner-cleanup-launcher.yml"
      - "repro/gen10_owner_cleanup/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-launcher-integration:
    runs-on: windows-2025
    steps:
      - name: Check out bounded reproducer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Set up CPython 3.13.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
      - name: Verify Python and payload boundary
        shell: pwsh
        run: |
          python --version
          $files = git diff --name-only origin/main...HEAD
          $unexpected = $files | Where-Object {
            $_ -ne ".github/workflows/gen10-owner-cleanup-launcher.yml" -and
            -not $_.StartsWith("repro/gen10_owner_cleanup/")
          }
          if ($unexpected) {
            Write-Error "Unexpected public payload paths: $($unexpected -join ', ')"
            exit 1
          }
      - name: Run sanitized launcher integration tests
        run: >-
          python -m unittest discover
          -s repro/gen10_owner_cleanup
          -p "test_*.py"
          -v
