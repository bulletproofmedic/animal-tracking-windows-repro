name: Generation-10 true private-successor acknowledgement public fallback

on:
  pull_request:
    paths:
      - "repro/g9_exact_production_ack/**"
      - ".github/workflows/g9-exact-production-ack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-true-private-successor-path:
    runs-on: windows-2025
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Record exact environment
        shell: pwsh
        run: |
          "runner_os=${{ runner.os }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "runner_image=windows-2025" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "diagnostic_commit=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "private_successor_commit=147b49aaf6549239b09dbd87212a7344ba5b374a" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "private_successor_tree=829c7e4b8ce9f812fd910a5bc577b331cf535eed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "python=$(python --version)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture | Format-List | Out-String | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Verify unchanged exact production and retained-test blobs
        shell: pwsh
        run: |
          $expected = [ordered]@{
            "repro/g9_exact_production_ack/animal_tracking/security/events.py" = "adcab482c1488fbaa7a1971d6ce7b1a8c9930936"
            "repro/g9_exact_production_ack/animal_tracking/_security_event_ack_guard.py" = "c7919944ae33fe093d047e525a858b8654a2aacd"
            "repro/g9_exact_production_ack/animal_tracking/_windows_handle_security.py" = "5476cfda8c2e4e2d4424a5aca5d6bb5e7e8692bd"
            "repro/g9_exact_production_ack/animal_tracking/_windows_acl_guard.py" = "3d55537e15c583bcfb6ac0f962bc8ff2ca1f13cb"
            "repro/g9_exact_production_ack/tests/test_security_event_acknowledgement_windows.py" = "00441f7098b8fd52308e5642c6ae8e0273d34071"
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (git hash-object -- $entry.Key).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Could not hash $($entry.Key)" }
            if ($actual -ne $entry.Value) {
              throw "Blob mismatch for $($entry.Key): expected $($entry.Value), observed $actual"
            }
            "exact_blob $($entry.Key)=$actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          $bootstrapPath = "repro/g9_exact_production_ack/animal_tracking/__init__.py"
          $bootstrapBlob = (git hash-object -- $bootstrapPath).Trim()
          if ($bootstrapBlob -ne "c402a67e28af94a2b8515822669fab7c8e8f677e") {
            throw "Unpatched bootstrap blob mismatch: observed $bootstrapBlob"
          }
          "unpatched_bootstrap_blob=$bootstrapBlob" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Materialize and verify exact private successor logging blob
        shell: pwsh
        run: |
          $path = "repro/g9_exact_production_ack/animal_tracking/logging_config.py"
          $retainedBlob = (git hash-object -- $path).Trim()
          if ($retainedBlob -ne "4a527fca84a5dfe2305b589598e47d47fcfe6236") {
            throw "Retained input blob mismatch: observed $retainedBlob"
          }
          $before = '$owner = $verified.Owner.Translate([System.Security.Principal.SecurityIdentifier]).Value'
          $after = '$owner = $verified.GetOwner([System.Security.Principal.SecurityIdentifier]).Value'
          $text = [System.IO.File]::ReadAllText($path)
          $matches = ([regex]::Matches($text, [regex]::Escape($before))).Count
          if ($matches -ne 1) { throw "Expected exactly one source replacement; observed $matches" }
          [System.IO.File]::WriteAllText($path, $text.Replace($before, $after), [System.Text.UTF8Encoding]::new($false))
          $successorBlob = (git hash-object -- $path).Trim()
          if ($successorBlob -ne "3f16826aa03503cc1c1e11ee417380c26af49ef6") {
            throw "Exact successor blob mismatch: expected 3f16826aa03503cc1c1e11ee417380c26af49ef6, observed $successorBlob"
          }
          if (([regex]::Matches([System.IO.File]::ReadAllText($path), [regex]::Escape($after))).Count -ne 1) {
            throw "Corrected owner-verification line was not unique"
          }
          "retained_logging_blob=$retainedBlob" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "exact_private_successor_logging_blob=$successorBlob" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Verify runtime uses the exact Gen10 implementation
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\repro\g9_exact_production_ack"
          @'
          import inspect
          from pathlib import Path
          from animal_tracking import logging_config

          function = logging_config._apply_windows_acl
          source_file = Path(inspect.getsourcefile(function) or "").resolve()
          expected_file = Path("repro/g9_exact_production_ack/animal_tracking/logging_config.py").resolve()
          source = inspect.getsource(function)
          if function.__module__ != "animal_tracking.logging_config":
              raise SystemExit(f"Runtime function was replaced by {function.__module__}")
          if source_file != expected_file:
              raise SystemExit(f"Runtime function came from {source_file}, expected {expected_file}")
          if ".GetOwner(" not in source or "Owner.Translate" in source:
              raise SystemExit("Runtime function does not contain the exact Gen10 owner verification")
          print(f"runtime_function_module={function.__module__}")
          print(f"runtime_function_file={source_file}")
          print("runtime_compatibility_patch_installed=false")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Runtime exact-source verification failed" }
          "runtime_compatibility_patch_installed=false" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Install exact retained test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input pytest==9.1.1

      - name: Run unchanged retained acknowledgement test against true Gen10 source
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\repro\g9_exact_production_ack"
          python -m pytest -q -s repro/g9_exact_production_ack/tests/test_security_event_acknowledgement_windows.py
